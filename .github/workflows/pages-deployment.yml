name: GitHub Pages Deployment Check

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/check-links.js'
      - '.github/workflows/pages-deployment.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/check-links.js'
      - '.github/workflows/pages-deployment.yml'

jobs:
  validate-site:
    name: Validate Built Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          MISSING=0
          for file in \
            docs/index.html \
            docs/styles.css \
            docs/.nojekyll \
            docs/CNAME \
            docs/about/index.html \
            docs/new-york/index.html \
            docs/new-york/problems/index.html \
            docs/federal/index.html; do
            if [ -f "$file" ]; then
              echo "✅ Found: $file"
            else
              echo "❌ Missing required file: $file"
              MISSING=$((MISSING + 1))
            fi
          done
          [ "$MISSING" -eq 0 ]

      - name: Check every page
        run: |
          FAILED=0
          for file in $(find docs -name index.html -not -path 'docs/assets/*'); do
            for needle in '<html lang="en">' '<meta name="viewport"' '<meta name="description"' '<title>' '<main id="main-content">'; do
              if ! grep -q "$needle" "$file"; then
                echo "❌ $file: missing $needle"
                FAILED=1
              fi
            done
            H1_COUNT=$(grep -o '<h1' "$file" | wc -l | tr -d ' ')
            if [ "$H1_COUNT" -ne 1 ]; then
              echo "❌ $file: $H1_COUNT h1 elements (expected 1)"
              FAILED=1
            fi
            if grep -q '{{' "$file"; then
              echo "❌ $file: unfilled {{placeholder}}"
              FAILED=1
            fi
            if grep '<img' "$file" | grep -qv 'alt='; then
              echo "❌ $file: image without alt text"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] && echo "✅ All pages pass"

      - name: Check internal links
        run: node scripts/check-links.js
